main:
  push:
    - name: Build and Deploy EdgeOne Pages (main)
      runner:
        tags: cnb:arch:amd64
        cpus: 16
      docker:
        image: node:24
        volumes:
          - /root/.local/share/pnpm/store:copy-on-write
      imports:
        - https://cnb.cool/sorkai/vue-pure-admin-max-secrets/-/blob/main/envs.yml
      env:
        NODE_OPTIONS: --max-old-space-size=8192
        VITE_PUBLIC_PATH: /
        VITE_ROUTER_HISTORY: hash
        VITE_CDN: "false"
        VITE_COMPRESSION: none
        VITE_PROXY_TARGET: https://aiedu-api.intelledu.cn
      stages:
        - name: Prepare pnpm
          script: |
            set -eu
            corepack enable
            corepack prepare pnpm@9 --activate
            node -v
            pnpm -v
            pnpm config set store-dir /root/.local/share/pnpm/store

        - name: Install dependencies
          script: |
            set -eu
            pnpm install --no-frozen-lockfile

        - name: Build
          script: |
            set -eu
            pnpm test:contracts
            pnpm typecheck
            pnpm build

        - name: Verify build output
          script: |
            set -eu
            test -d dist
            oversized="$(find dist -type f -size +25000000c -print)"
            if [ -n "$oversized" ]; then
              echo "EdgeOne Pages rejects files larger than 25 MiB:" >&2
              printf '%s\n' "$oversized" >&2
              exit 1
            fi
            test -f dist/index.html
            test -f dist/virtual-people/index.html
            test -f dist/virtual-people/motions.json
            test -f dist/virtual-people/QmingVirtualPeopleTestVersion1.0.vrm
            test -f dist/virtual-people/vendor/three/build/three.module.js
            test -f dist/virtual-people/vendor/three/build/three.core.js
            test -f dist/virtual-people/vendor/three/examples/jsm/loaders/GLTFLoader.js
            test -f dist/virtual-people/vendor/three-vrm/three-vrm.module.js
            test -f dist/virtual-people/vendor/pinyin-pro/index.mjs
            if grep -q 'node_modules/' dist/virtual-people/index.html; then
              echo "Standalone digital human still references node_modules" >&2
              exit 1
            fi

        - name: Deploy to EdgeOne Pages
          script: |
            set -eu
            if [ -z "${EDGEONE_API_TOKEN:-}" ]; then
              echo "EDGEONE_API_TOKEN is not configured. Import it from a CNB secret repository before deploying." >&2
              exit 1
            fi
            deploy_log="$(mktemp)"
            trap 'rm -f "$deploy_log"' EXIT
            npx --yes edgeone pages deploy ./dist -n aiedu -t "$EDGEONE_API_TOKEN" -e production --json | tee "$deploy_log"
            deploy_url="$(node -e '
              const fs = require("node:fs");
              const lines = fs.readFileSync(process.argv[1], "utf8").trim().split(/\n/).reverse();
              const result = lines.map(line => { try { return JSON.parse(line); } catch { return null; } }).find(item => item?.status === "success" && item.url);
              if (!result) process.exit(1);
              process.stdout.write(result.url);
            ' "$deploy_log")"
            node scripts/verify-edgeone-deployment.mjs "$deploy_url" \
              --json virtual-people/motions.json \
              --binary virtual-people/QmingVirtualPeopleTestVersion1.0.vrm \
              --asset virtual-people/vendor/three/build/three.module.js \
              --asset virtual-people/vendor/three-vrm/three-vrm.module.js \
              --asset virtual-people/vendor/three/examples/jsm/libs/draco/gltf/draco_wasm_wrapper.js \
              --asset virtual-people/vendor/three/examples/jsm/libs/draco/gltf/draco_decoder.wasm
            echo "EdgeOne deployment verified: $deploy_url"

